spring.application.name=billboard-test

# H2 in MySQL compatibility mode so the Flyway migrations run unchanged in tests.
spring.datasource.url=jdbc:h2:mem:adspace_market;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt.secret=test-secret-test-secret-test-secret-test-secret
app.security.jwt.expiration-minutes=60

app.storage.minio.endpoint=http://localhost:9000
app.storage.minio.access-key=test
app.storage.minio.secret-key=test12345
app.storage.minio.bucket=adspace-market-media-test
app.storage.minio.presigned-url-expiry-minutes=60

spring.mail.host=localhost
spring.mail.port=1025
app.notification.mail.enabled=false
app.notification.mail.from-address=no-reply@adspacemarket.com
app.notification.mail.from-name=AdSpace Market

app.booking.order-expiration-minutes=60
app.booking.expiration-check-interval-ms=3600000

spring.modulith.events.republish-outstanding-events-on-restart=true
