spring.application.name=billboard

# --- Datasource (MySQL) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/adspace_market}
spring.datasource.username=${DB_USERNAME:adspace}
spring.datasource.password=${DB_PASSWORD:adspace}

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Store java.util.UUID columns as CHAR(36), portable across MySQL/H2 (see V1__init_schema.sql).
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Security / JWT ---
# Override app.security.jwt.secret in every real environment (32+ random bytes).
app.security.jwt.secret=${JWT_SECRET:change-me-in-production-change-me-in-production}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- MinIO (per-user image storage, see media module) ---
app.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.access-key=${MINIO_ACCESS_KEY:adspace}
app.storage.minio.secret-key=${MINIO_SECRET_KEY:adspace123}
app.storage.minio.bucket=${MINIO_BUCKET:adspace-market-media}
app.storage.minio.presigned-url-expiry-minutes=${MINIO_PRESIGNED_URL_EXPIRY_MINUTES:60}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Mail (see notification module) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Read by MailConfig#javaMailSender; auth is enabled automatically when a username is set.
# Use "tls" (STARTTLS, e.g. port 587) or "ssl" (implicit TLS, e.g. port 465); leave blank for none.
app.mail.encryption=${MAIL_ENCRYPTION:}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.notification.mail.enabled=${MAIL_ENABLED:true}
app.notification.mail.from-address=${MAIL_FROM:no-reply@adspacemarket.com}
app.notification.mail.from-name=${MAIL_FROM_NAME:AdSpace Market}

# --- Booking: auto-expiration of unpaid orders ---
app.booking.order-expiration-minutes=${ORDER_EXPIRATION_MINUTES:60}
app.booking.expiration-check-interval-ms=${ORDER_EXPIRATION_CHECK_INTERVAL_MS:60000}

# --- Admin bootstrap: create the ADMIN account once at startup if it doesn't exist yet ---
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.company-name=${ADMIN_COMPANY_NAME:AdSpace Market}

# --- Modulith event publication registry ---
# Durably records every published event; incomplete ones (crash/SMTP outage before a
# listener finished) are automatically retried the next time the app starts.
spring.modulith.events.republish-outstanding-events-on-restart=true